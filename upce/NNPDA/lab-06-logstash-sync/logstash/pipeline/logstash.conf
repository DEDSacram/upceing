input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/logstash-core/lib/jars/postgresql-42.7.3.jar"
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/shop"
    jdbc_user => "shop"
    jdbc_password => "shop"

    # Poll Postgres every minute for changed rows.
    schedule => "* * * * *"

    # Incremental sync: only fetch rows newer than the last run.
    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/.logstash_jdbc_last_run_products"

    # Paginate large result sets.
    jdbc_paging_enabled => true
    jdbc_page_size => 1000

    # :sql_last_value is maintained by Logstash from tracking_column.
    statement => "SELECT id, name, description, price, updated_at FROM products WHERE updated_at > :sql_last_value ORDER BY updated_at ASC"
  }
}

filter {
  # Normalize types; keep the ES document shape stable.
  mutate {
    convert => { "price" => "float" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "products"
    # document_id = Postgres PK -> re-running the pipeline overwrites
    # instead of duplicating (idempotent upsert).
    document_id => "%{id}"
  }
  stdout { codec => rubydebug { metadata => false } }
}

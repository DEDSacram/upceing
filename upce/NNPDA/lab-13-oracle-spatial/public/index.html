<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Lab 13 — cities GeoJSON</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.1.0/ol.css"/>
<script src="https://cdn.jsdelivr.net/npm/ol@v9.1.0/dist/ol.js"></script>
<style>#map { width: 100%; height: 90vh; }</style>
</head>
<body>
<div id="map"></div>
<script>
fetch('/api/geo/cities')
  .then(r => r.json())
  .then(geojson => {
    const features = new ol.format.GeoJSON().readFeatures(geojson, {
      featureProjection: 'EPSG:3857'
    });
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({ source: new ol.source.OSM() }),
        new ol.layer.Vector({ source: new ol.source.Vector({ features }) })
      ],
      view: new ol.View({ center: ol.proj.fromLonLat([15.79, 50.03]), zoom: 10 })
    });
  });
</script>
</body>
</html>
